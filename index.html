<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Cryptocurrency Website</title>
</head>
<body class="container bg-muted-primary p-3">
    <nav class="navbar bg-muted-primary">
        <div class="container-fluid p-5">
            <div class="nav-overflow" data-bs-toggle="nav-overflow">
                <div class="d-flex">
                    <ul class="nav nav-underline d-flex gap-10 fs-lg w-100">
                        <li class="nav-item p-3">
                            <a href="#" class="nav-link">Market</a>
                        </li>
                        <li class="nav-item p-3">
                            <a href="#" class="nav-link">Features</a>
                        </li>
                        <li class="nav-item p-3">
                            <a href="#" class="nav-link">White Papers</a>
                        </li>
                        <li class="nav-item p-3">
                            <a href="#" class="nav-link">About Us</a>
                        </li>
                        <li class="nav-item p-3 ms-auto">
                            <button class="btn-solid theme-secondary ms-auto hover-lift" data-bs-toggle="menu">Language</button>
                            <div class="menu">
                                <a href="#" class="menu-item">EN</a>
                                <a href="#" class="menu-item">DE</a>
                                <a href="#" class="menu-item">FR</a>
                            </div>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>
    
    <div class="container row justify-content-center gx-5 mt-5 hero">
        <div class="col p-3 m-auto">
            <div class="fs-6xl headingtext">BUY AND SELL CRYPTO</div>
            <div class="fs-lg m-auto text2">World's biggest Cryptocurrency exchange available on web as well as mobile</div>
            <button type="button" class="btn-outline btn-styled btn-lg theme-warning mt-5 b-0 hover-lift themebutton">Explore More</button>
        </div>
        <div class="col p-3 m-auto">
            <div class="px-5 ">
                <img src="images/pierre-borthiry-peiobty-vBCVcWUyvyM-unsplash.jpg" alt="" class="main-image">

            </div>
        </div>
    </div>
    
    <div class="container p-5 d-flex justify-content-end">
        <div class="d-flex gap-10 p-2">
            <div class="d-flex p-2">
                <div class="p-2 align-items-center">
                    <img src="images/kanchanara-7E3QGntO66M-unsplash.jpg" alt="Bitcoin logo" class="bitcoin-image mt-2">
                </div>
                <div class="container">
                    <div class="d-block p-2 mt-2" id="bitcoin-price">Loading...</div>
                    <div class="d-block p-2 mb-2">Bitcoin</div>
                </div>
            </div>
            <div class="d-flex p-3">
                <div class="p-2">
                    <img src="images/kanchanara-RhcP9Sw-cGA-unsplash.jpg" alt="Ethereum logo" class="bitcoin-image mt-2">
                </div>
                <div class="container">
                    <div class="d-block p-2 mt-2" id="ethereum-price">Loading...</div>
                    <div class="d-block p-2 mb-2">Ethereum</div>
                </div>
            </div>
            <div class="d-flex p-3">
                <div class="p-2">
                    <img src="images/kanchanara-rfUl0Lfyays-unsplash.jpg" alt="Dogecoin logo" srcset="" class="bitcoin-image mt-2">
                </div>
                <div class="container">
                    <div class="d-block p-2 mt-2" id="dogecoin-price">Loading...</div>
                    <div class="d-block p-2 mb-2">Dogecoin</div>
                </div>
            </div>
        </div>
    </div>
    
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
